services:
  db:
    image: postgres:15
    container_name: producttrial_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-producttrial}
      POSTGRES_USER: ${DB_USER:-producttrial_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-producttrial_pass}
    volumes:
      - producttrial_pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-producttrial_user} -d ${DB_NAME:-producttrial}"]
      interval: 5s
      timeout: 5s
      retries: 12

    networks:
      - productnet

  app:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: producttrial_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:${DB_PORT:-5432}/${DB_NAME:-producttrial}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-producttrial_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-producttrial_pass}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: ${JAVA_OPTS:-}
    ports:
      - "8080:8080"
    networks:
      - productnet

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: producttrial_front
    restart: unless-stopped
    depends_on:
      - app
    environment:
      VITE_API_TARGET: http://app:8080
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./front:/app
      - producttrial_front_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - productnet

  kafka:
    image: apache/kafka:latest
    container_name: producttrial_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - productnet
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: producttrial_kafka_ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    networks:
      - productnet

volumes:
  producttrial_pgdata:
  producttrial_front_node_modules:

networks:
  productnet:
    driver: bridge
    name: producttrial_productnet
